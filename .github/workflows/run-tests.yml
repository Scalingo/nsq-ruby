name: Run Tests
on: push

jobs:
  test:
    strategy:
      matrix:
        ruby_version: ['2.7', '3.2', '3.3', '3.4', '4.0']
    runs-on: ubuntu-24.04
    steps:
      - name: Install NSQ
        shell: bash
        run: |
          wget https://github.com/nsqio/nsq/releases/download/v1.3.0/nsq-1.3.0.linux-amd64.go1.21.5.tar.gz
          tar xvzf nsq-1.3.0.linux-amd64.go1.21.5.tar.gz
          mv nsq-1.3.0.linux-amd64.go1.21.5/bin/* /usr/local/bin

      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby_version }}
          # Gemfile.lock is BUNDLED WITH a Bundler that needs Ruby >= 3.1; 2.4 is the last Bundler supporting Ruby 2.7
          bundler: ${{ matrix.ruby_version == '2.7' && '2.4' || 'Gemfile.lock' }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically

      - name: Run tests
        shell: bash
        run: |
          echo "path: $PATH"
          bundle exec rspec spec
